[package]
name = "siakap-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
portable-pty = "0.9"
rand = "0.8"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
