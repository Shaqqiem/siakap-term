[package]
name = "siakap-terminal"
description = "Siakap Terminal - secure, privacy-focused terminal and SSH client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "siakap_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
siakap-core = { path = "../core" }
tauri = { version = "2.12", features = ["image-png"] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["sync", "time"] }
zeroize = "1"
arboard = { version = "3", default-features = false }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }

[dev-dependencies]
tempfile = "3"
