name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Install npm dependencies
        run: npm ci

      - name: Core tests
        run: cargo test -p siakap-core --locked

      - name: Frontend tests
        run: npm test

      - name: Build installers
        run: npm run tauri build

      - name: Collect installers and checksums
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force -Path dist-installers
          Get-ChildItem target/release/bundle/nsis/*.exe, target/release/bundle/msi/*.msi |
            Copy-Item -Destination $out
          Push-Location $out
          Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: siakap-terminal-windows-x64
          path: dist-installers/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: siakap-terminal-windows-x64
          path: dist-installers
      - name: Verify checksums
        working-directory: dist-installers
        run: sha256sum -c SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist-installers/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
