name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Install npm dependencies
        run: npm ci

      - name: Core tests
        run: cargo test -p siakap-core --locked

      - name: Frontend tests
        run: npm test

      - name: Build installers
        run: npm run tauri build

      - name: Collect installers and checksums
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force -Path dist-installers
          Get-ChildItem target/release/bundle/nsis/*.exe, target/release/bundle/msi/*.msi |
            Copy-Item -Destination $out
          Push-Location $out
          Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: siakap-terminal-windows-x64
          path: dist-installers/*
          if-no-files-found: error

  # macOS: one universal .dmg (Apple silicon and Intel). Ad-hoc signed, not
  # notarised: the first launch needs right-click > Open (see README).
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version

      - name: Install npm dependencies
        run: npm ci

      - name: Core tests
        run: cargo test -p siakap-core --locked

      - name: Frontend tests
        run: npm test

      - name: Build the app and disk image
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Collect the disk image and checksums
        run: |
          mkdir -p dist-installers
          ver=$(jq -r .version src-tauri/tauri.conf.json)
          # Named like the Windows files; GitHub shows the space as a dot.
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "dist-installers/Siakap Terminal_${ver}_universal.dmg"
          codesign --verify --deep --verbose=2 "target/universal-apple-darwin/release/bundle/macos/Siakap Terminal.app"
          lipo -archs "target/universal-apple-darwin/release/bundle/macos/Siakap Terminal.app/Contents/MacOS/siakap-terminal"
          cd dist-installers
          shasum -a 256 *.dmg | tee SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: siakap-terminal-macos-universal
          path: dist-installers/*
          if-no-files-found: error

  # Known-vulnerability scan of Rust and npm dependencies (RustSec / npm advisories).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: npm audit
        run: npm audit --audit-level=high
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  # Publishes a GitHub Release for the version in src-tauri/tauri.conf.json the
  # first time that version reaches main (or when a v* tag is pushed). To ship a
  # new release, bump the version and push to main.
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Work out the version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(jq -r .version src-tauri/tauri.conf.json)
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          if gh release view "v$ver" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$ver already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: steps.ver.outputs.exists == 'false'
        with:
          name: siakap-terminal-windows-x64
          path: dist-installers
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: steps.ver.outputs.exists == 'false'
        with:
          name: siakap-terminal-macos-universal
          path: dist-macos
      - name: Verify and merge checksums
        if: steps.ver.outputs.exists == 'false'
        run: |
          (cd dist-installers && sha256sum -c SHA256SUMS.txt)
          (cd dist-macos && sha256sum -c SHA256SUMS-macos.txt)
          cp dist-macos/*.dmg dist-installers/
          cd dist-installers
          rm SHA256SUMS.txt
          sha256sum -- *.exe *.msi *.dmg | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Create GitHub release
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # Written notes from CHANGELOG.md (fails if the version has no section).
          python3 scripts/release-notes.py "${TAG#v}" dist-installers/SHA256SUMS.txt > release-notes.md
          gh release create "$TAG" dist-installers/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Siakap Terminal ${TAG#v}" --notes-file release-notes.md

  notes:
    # Keep every release's notes in step with CHANGELOG.md (safe to repeat).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Refresh release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p notes
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName'); do
            v="${tag#v}"
            sums=""
            if gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS.txt -D "notes/$v" --clobber 2>/dev/null; then
              sums="notes/$v/SHA256SUMS.txt"
            fi
            if python3 scripts/release-notes.py "$v" $sums > "notes/$v.md"; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "notes/$v.md" >/dev/null
              echo "updated $tag"
            else
              echo "skipped $tag (no CHANGELOG section)"
            fi
          done
