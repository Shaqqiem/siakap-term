name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Install npm dependencies
        run: npm ci

      - name: Core tests
        run: cargo test -p siakap-core --locked

      - name: Frontend tests
        run: npm test

      - name: Build installers
        run: npm run tauri build

      - name: Collect installers and checksums
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force -Path dist-installers
          Get-ChildItem target/release/bundle/nsis/*.exe, target/release/bundle/msi/*.msi |
            Copy-Item -Destination $out
          Push-Location $out
          Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location

      - uses: actions/upload-artifact@v5
        with:
          name: siakap-terminal-windows-x64
          path: dist-installers/*
          if-no-files-found: error

  # Publishes a GitHub Release for the version in src-tauri/tauri.conf.json the
  # first time that version reaches main (or when a v* tag is pushed). To ship a
  # new release, bump the version and push to main.
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Work out the version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(jq -r .version src-tauri/tauri.conf.json)
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          if gh release view "v$ver" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$ver already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v5
        if: steps.ver.outputs.exists == 'false'
        with:
          name: siakap-terminal-windows-x64
          path: dist-installers
      - name: Verify checksums
        if: steps.ver.outputs.exists == 'false'
        working-directory: dist-installers
        run: sha256sum -c SHA256SUMS.txt
      - name: Create GitHub release
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release create "$TAG" dist-installers/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Siakap Terminal ${TAG#v}" --generate-notes
