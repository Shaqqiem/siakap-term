[workspace]
resolver = "2"
members = ["core", "src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2021"
publish = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Argon2 is unbearably slow unoptimised; keep tests and `tauri dev` snappy.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
