<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Siakap Terminal</title>
  </head>
  <body>
    <!-- Window controls: always top-right, also over the lock screen. -->
    <div class="win-controls" id="win-controls">
      <button id="win-min" title="Minimize" data-icon="win-min" data-icon-size="14"></button>
      <button id="win-max" title="Maximize" data-icon="win-max" data-icon-size="14"></button>
      <button id="win-close" class="win-close" title="Close" data-icon="x" data-icon-size="15"></button>
    </div>
    <div id="lock" class="lock hidden">
      <div class="lock-drag" data-tauri-drag-region></div>
      <form id="lock-form" class="lock-card" autocomplete="off">
        <div class="brand"><span class="logo" data-icon="logo" data-icon-size="28"></span><span>Siakap Terminal</span></div>
        <p id="lock-hint" class="muted"></p>
        <input id="lock-pass" type="password" placeholder="Master password" autocomplete="off" spellcheck="false" />
        <input id="lock-pass2" type="password" placeholder="Repeat master password" class="hidden" autocomplete="off" />
        <div id="lock-error" class="error"></div>
        <button id="lock-submit" type="submit" class="primary">Unlock</button>
        <p class="muted small">Sessions, macros, saved passwords and known hosts are encrypted with this password.
          There is no way to recover it, so keep it somewhere safe.</p>
      </form>
    </div>

    <div id="app" class="app hidden">
      <nav class="rail" aria-label="Tools">
        <button data-panel="sessions" title="Sessions" data-icon="sessions"><span>Sessions</span></button>
        <button data-panel="macros" title="Macros" data-icon="macros"><span>Macros</span></button>
        <button data-panel="sftp" title="SFTP" data-icon="folder"><span>SFTP</span></button>
        <button data-panel="settings" title="Settings" data-icon="settings"><span>Settings</span></button>
        <div class="rail-spacer" data-tauri-drag-region></div>
        <button id="btn-security-key" title="Move your security key between Windows and WSL (usbipd)" data-icon="key"><span>Key</span></button>
        <button id="btn-lock" title="Lock the vault" data-icon="lock"><span>Lock</span></button>
      </nav>
      <aside id="panel" class="panel">
        <section id="panel-sessions" class="panel-body"></section>
        <section id="panel-macros" class="panel-body hidden"></section>
        <section id="panel-sftp" class="panel-body hidden"></section>
        <section id="panel-settings" class="panel-body hidden"></section>
      </aside>
      <div id="panel-resizer" class="resizer" title="Drag to resize, double-click to collapse"></div>
      <main class="main">
        <div class="tabbar" data-tauri-drag-region>
          <div id="tabs" class="tabs"></div>
          <div class="titlebar-drag" data-tauri-drag-region></div>
          <div class="tab-actions">
            <button id="btn-new-local" title="New local shell (Ctrl+Shift+T)" data-icon="plus" data-icon-size="16"></button>
            <button id="btn-split-h" title="Split side by side (Ctrl+Shift+D)" data-icon="split-h" data-icon-size="16"></button>
            <button id="btn-split-v" title="Split top and bottom (Ctrl+Shift+E)" data-icon="split-v" data-icon-size="16"></button>
            <button id="btn-grid" title="Split into 4 panes (Ctrl+Shift+G)" data-icon="grid" data-icon-size="16"></button>
          </div>
        </div>
        <div id="macro-bar" class="macro-bar hidden"></div>
        <div id="workspace" class="workspace">
          <div id="empty" class="empty"></div>
        </div>
      </main>
    </div>
    <div id="modal-root"></div>
    <div id="toasts" class="toasts"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
